<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Remote Control</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#0d0d14; color:#e0e0e0; font-family:'Segoe UI',Arial,sans-serif; height:100vh; overflow:hidden; }
  #list-page { height:100vh; overflow-y:auto; padding:24px 20px; }
  .page-title { font-size:22px; font-weight:700; color:#fff; margin-bottom:4px; display:flex; align-items:center; gap:10px; }
  .page-title span { font-size:26px; }
  .page-sub { color:#555; font-size:13px; margin-bottom:24px; }
  .device-card { background:#141420; border:1px solid #1e1e30; border-radius:12px; padding:16px 18px; margin-bottom:12px; display:flex; align-items:center; gap:10px; transition:all 0.15s; }
  .device-card:hover { border-color:#4f46e5; background:#161624; }
  .device-icon { width:42px; height:42px; border-radius:10px; background:#1e1e35; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .device-name { font-size:16px; font-weight:600; color:#fff; }
  .device-meta { font-size:12px; color:#555; margin-top:3px; }
  .btn-icon { background:none; border:1px solid #2a2a40; color:#666; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:13px; flex-shrink:0; }
  .btn-icon:hover { border-color:#4f46e5; color:#aaa; }
  .btn-del { border-color:#3a1a1a; color:#e05555; }
  .btn-del:hover { border-color:#e05555; background:#1a0a0a; }
  .btn-connect { background:#4f46e5; color:#fff; border:none; border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:600; flex-shrink:0; }
  .empty { color:#444; font-size:14px; padding:20px 0; }

  /* 모달 */
  #modal { display:none; position:fixed; inset:0; background:#00000088; z-index:100; align-items:center; justify-content:center; }
  #modal.show { display:flex; }
  .modal-box { background:#141420; border:1px solid #2a2a40; border-radius:14px; padding:24px; width:90%; max-width:360px; }
  .modal-title { font-size:16px; font-weight:700; color:#fff; margin-bottom:16px; }
  .modal-input { width:100%; background:#0d0d14; border:1px solid #2a2a40; border-radius:8px; padding:10px 14px; color:#fff; font-size:15px; outline:none; margin-bottom:16px; }
  .modal-input:focus { border-color:#4f46e5; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; }
  .modal-cancel { background:none; border:1px solid #2a2a40; color:#aaa; border-radius:8px; padding:8px 16px; cursor:pointer; }
  .modal-save { background:#4f46e5; color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-weight:600; }
  .modal-danger { background:#e05555; color:#fff; border:none; border-radius:8px; padding:8px 16px; cursor:pointer; font-weight:600; }

  /* 뷰어 */
  #viewer-page { display:none; flex-direction:column; height:100vh; }
  #toolbar { background:#0a0a10; border-bottom:1px solid #1a1a28; padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; min-height:48px; }
  #toolbar.hidden { display:none; }
  #back-btn { background:none; border:1px solid #2a2a40; color:#aaa; padding:5px 10px; border-radius:7px; cursor:pointer; font-size:12px; }
  #dev-name { font-weight:700; font-size:14px; color:#fff; }
  #toggle-btn { padding:5px 14px; border:none; border-radius:20px; cursor:pointer; font-weight:700; font-size:12px; background:#1e1e30; color:#666; transition:all 0.2s; }
  #toggle-btn.on { background:#4f46e5; color:#fff; }
  #del-btn { background:none; border:1px solid #3a1a1a; color:#e05555; padding:5px 10px; border-radius:7px; cursor:pointer; font-size:12px; }
  #conn-status { font-size:11px; color:#555; }
  #fps-display { font-size:11px; color:#333; margin-left:auto; }
  #hint-bar { background:#4f46e580; color:#fff; font-size:12px; text-align:center; padding:4px; flex-shrink:0; }
  #canvas-wrap { flex:1; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; position:relative; }
  #screen { max-width:100%; max-height:100%; display:block; cursor:none; }
  #canvas-hint { position:absolute; color:#333; font-size:15px; pointer-events:none; }
</style>
</head>
<body>

<div id="list-page">
  <div class="page-title"><span>🖥️</span> Remote Control</div>
  <div class="page-sub">접속할 기기를 선택하세요</div>
  <div id="devices-wrap"><div class="empty">기기 검색 중...</div></div>
</div>

<!-- 이름 변경 모달 -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">기기 이름 변경</div>
    <input id="rename-input" class="modal-input" type="text" placeholder="새 이름 입력">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-save" id="modal-ok" onclick="saveName()">저장</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="del-modal" style="display:none;position:fixed;inset:0;background:#00000088;z-index:100;align-items:center;justify-content:center;">
  <div class="modal-box">
    <div class="modal-title">⚠️ 에이전트 삭제</div>
    <p style="color:#aaa;font-size:14px;margin-bottom:20px;">이 기기에서 원격 제어 프로그램을 삭제합니다. 계속하시겠습니까?</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeDelModal()">취소</button>
      <button class="modal-danger" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<div id="viewer-page">
  <div id="toolbar">
    <button id="back-btn" onclick="disconnect()">← 뒤로</button>
    <span id="dev-name"></span>
    <button id="toggle-btn" onclick="toggleControl()">제어 OFF</button>
    <button id="del-btn" onclick="openDelModal()">🗑️ 삭제</button>
    <span id="conn-status">연결 중...</span>
    <span id="fps-display"></span>
  </div>
  <div id="hint-bar" style="display:none">🖥️ 전체화면 제어 중 — ESC 또는 F11로 제어 종료</div>
  <div id="canvas-wrap">
    <canvas id="screen" tabindex="0"></canvas>
    <div id="canvas-hint">화면 불러오는 중...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const RELAY_URL = "wss://rc-setup-production.up.railway.app";

firebase.initializeApp({
  apiKey: "AIzaSyDr0Pw6UZVLJiZbqnChHr4MlzwWejYArFc",
  authDomain: "remote-ctrl-c3035.firebaseapp.com",
  databaseURL: "https://remote-ctrl-c3035-default-rtdb.firebaseio.com",
  projectId: "remote-ctrl-c3035",
  storageBucket: "remote-ctrl-c3035.firebasestorage.app",
  messagingSenderId: "309669054570",
  appId: "1:309669054570:web:a8ae7c0b61b02ebc3fa213"
});
const db = firebase.database();

let ws = null;
let ctrlOn = false;
let fCount = 0, fTime = Date.now();
let renameDeviceId = null;
let deleteDeviceId = null;
let currentDeviceId = null;

// 기기 목록
db.ref("devices").on("value", snap => {
  const wrap = document.getElementById("devices-wrap");
  const data = snap.val();
  if (!data || !Object.keys(data).length) {
    wrap.innerHTML = '<div class="empty">온라인 기기 없음</div>';
    return;
  }
  wrap.innerHTML = "";
  Object.entries(data).forEach(([id, info]) => {
    if (info.status !== "online") return;
    const displayName = info.name || id;
    const osIcon = info.os === "Darwin" ? "🍎" : "🖥️";
    const card = document.createElement("div");
    card.className = "device-card";
    card.innerHTML = `
      <div class="device-icon">${osIcon}</div>
      <div style="flex:1">
        <div class="device-name">${displayName}</div>
        <div class="device-meta">${id}</div>
      </div>
      <button class="btn-icon" onclick="openModal('${id}','${displayName}')">✏️</button>
      <button class="btn-icon btn-del" onclick="openDelModal('${id}')">🗑️</button>
      <button class="btn-connect" onclick="connect('${id}','${displayName}')">접속</button>
    `;
    wrap.appendChild(card);
  });
});

// 이름 변경
function openModal(id, currentName) {
  renameDeviceId = id;
  document.getElementById("rename-input").value = currentName;
  document.getElementById("modal").classList.add("show");
  setTimeout(() => document.getElementById("rename-input").focus(), 100);
}
function closeModal() {
  document.getElementById("modal").classList.remove("show");
  renameDeviceId = null;
}
function saveName() {
  if (!renameDeviceId) return;
  const newName = document.getElementById("rename-input").value.trim();
  if (!newName) return;
  db.ref(`devices/${renameDeviceId}/name`).set(newName);
  closeModal();
}
document.getElementById("rename-input").addEventListener("keydown", e => {
  if (e.key === "Enter") saveName();
  if (e.key === "Escape") closeModal();
});

// 삭제
function openDelModal(id) {
  deleteDeviceId = id || currentDeviceId;
  document.getElementById("del-modal").style.display = "flex";
}
function closeDelModal() {
  document.getElementById("del-modal").style.display = "none";
  deleteDeviceId = null;
}
function confirmDelete() {
  send({ t: "uninstall" });
  closeDelModal();
  setTimeout(disconnect, 2000);
}

// 연결
function connect(id, displayName) {
  currentDeviceId = id;
  document.getElementById("list-page").style.display = "none";
  document.getElementById("viewer-page").style.display = "flex";
  document.getElementById("dev-name").textContent = displayName;
  document.getElementById("conn-status").textContent = "연결 중...";
  document.getElementById("canvas-hint").style.display = "flex";

  ws = new WebSocket(RELAY_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ role: "viewer", id: id }));
    document.getElementById("conn-status").textContent = "연결됨";
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.t === "frame") renderFrame(msg.d);
    } catch {}
  };
  ws.onclose = () => {
    document.getElementById("conn-status").textContent = "끊김";
    if (ctrlOn) disableControl();
  };
  ws.onerror = () => {
    document.getElementById("conn-status").textContent = "연결 실패";
  };
}

function disconnect() {
  if (ctrlOn) disableControl();
  if (ws) { ws.close(); ws = null; }
  document.getElementById("list-page").style.display = "block";
  document.getElementById("viewer-page").style.display = "none";
  currentDeviceId = null;
}

// 화면 렌더링
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

function renderFrame(b64) {
  const img = new Image();
  img.onload = () => {
    if (canvas.width !== img.width) canvas.width = img.width;
    if (canvas.height !== img.height) canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    document.getElementById("canvas-hint").style.display = "none";
    fCount++;
    const now = Date.now();
    if (now - fTime >= 1000) {
      document.getElementById("fps-display").textContent = `${fCount} fps`;
      fCount = 0; fTime = now;
    }
  };
  img.src = "data:image/jpeg;base64," + b64;
}

// 제어 ON/OFF
function toggleControl() {
  if (ctrlOn) {
    disableControl();
  } else {
    enableControl();
  }
}

function enableControl() {
  ctrlOn = true;
  const btn = document.getElementById("toggle-btn");
  btn.textContent = "제어 ON";
  btn.className = "on";
  send({ t: "toggle", active: true });
  canvas.focus();

  // 전체화면
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

  document.getElementById("toolbar").classList.add("hidden");
  document.getElementById("hint-bar").style.display = "block";
}

function disableControl() {
  ctrlOn = false;
  const btn = document.getElementById("toggle-btn");
  btn.textContent = "제어 OFF";
  btn.className = "";
  send({ t: "toggle", active: false });

  // 전체화면 해제
  if (document.fullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  document.getElementById("toolbar").classList.remove("hidden");
  document.getElementById("hint-bar").style.display = "none";
}

// 전체화면 변경 감지 (사용자가 직접 ESC 눌러서 나갔을 때)
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && ctrlOn) {
    disableControl();
  }
});
document.addEventListener("webkitfullscreenchange", () => {
  if (!document.webkitFullscreenElement && ctrlOn) {
    disableControl();
  }
});

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify(obj));
}

// 마우스 입력
canvas.addEventListener("mousemove", e => {
  if (!ctrlOn) return;
  const r = canvas.getBoundingClientRect();
  send({ t:"move", x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height });
});
canvas.addEventListener("mousedown", e => {
  if (!ctrlOn) return;
  const r = canvas.getBoundingClientRect();
  send({ t:"click", x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, btn:e.button===0?"l":"r", down:true });
  e.preventDefault();
});
canvas.addEventListener("mouseup", e => {
  if (!ctrlOn) return;
  const r = canvas.getBoundingClientRect();
  send({ t:"click", x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, btn:e.button===0?"l":"r", down:false });
});
canvas.addEventListener("wheel", e => {
  if (!ctrlOn) return;
  send({ t:"scroll", dy:e.deltaY>0?-1:1 });
  e.preventDefault();
}, { passive:false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

// 키보드 입력
document.addEventListener("keydown", e => {
  if (!ctrlOn) return;

  // ESC 또는 F11 → 제어 종료
  if (e.key === "Escape" || e.key === "F11") {
    disableControl();
    e.preventDefault();
    return;
  }

  send({ t:"key", key:e.key.length===1?e.key:e.key.toLowerCase(), down:true });
  e.preventDefault();
});
document.addEventListener("keyup", e => {
  if (!ctrlOn) return;
  if (e.key === "Escape" || e.key === "F11") return;
  send({ t:"key", key:e.key.length===1?e.key:e.key.toLowerCase(), down:false });
});
</script>
</body>
</html>
